name: Django tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==1.8.4
          poetry check --lock
          poetry install --no-root
      - name: Install project template dependency
        run: make setup-crispy-tailwind
      - name: Check formatting and migrations
        run: |
          poetry run black --check .
          poetry run python manage.py makemigrations --check --dry-run --settings=carshare.test_settings
      - name: Run PostgreSQL-backed Django suite
        run: make test TEST_ARGS="--noinput --verbosity 2"
